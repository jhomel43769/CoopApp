<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Administrador - COOPMAIMÓN</title>
  <link rel="stylesheet" href="css/G-styles.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <header>
    <div class="contenedor">
      <img src="img/logoCoopMaimon.png" alt="COOPMAIMÓN" class="logo">
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="nosotros.html">¿Quiénes Somos?</a></li>
          <li><a href="servicios.html">Servicios</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="login-container">
      <h1>Acceso Administrativo</h1>
      <form action="php/login.php" method="POST">
        <div class="form-group">
          <label for="usuario">Usuario:</label>
          <input type="text" id="usuario" name="usuario" required />
        </div>

        <div class="form-group">
          <label for="clave">Contraseña:</label>
          <input type="password" id="clave" name="clave" required />
        </div>

        <button type="submit" class="boton-login">Ingresar</button>
      </form>
    </section>
  </main>
  <footer>
    <div class="contenedor">
      <p>Oficina Principal: Calle Padre Fantino No. 7, Maimón, Monseñor Nouel.</p>
      <p>Teléfono: (809) 551-2344 | Correo: info@coopmaimon.com</p>
      <p>&copy; 2025 COOPMAIMÓN</p>
    </div>
  </footer>
</body>
</html>
